{% extends 'cursos/base.html' %}

{% block breadcrumb %}
    <li class="breadcrumb-item"><a href="/cursos/">Cursos</a></li>
    <li class="breadcrumb-item active" aria-current="page">Editar curso</li>
{% endblock %}

{% block context %}
<div class="card">
    <div class="card-header m-0 p-0">
        <div class="containerfluid d-flex justify-content-between align-items-center">
            <h1 class="card-title">Editar curso</h1>
        </div>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-floating mb-3">
                <input
                    type="text"
                    class="form-control"
                    id="nombreCursoInput"
                    name="nombre_curso"
                    value="{{detalle.nombre}}"
                    placeholder="Nombre del curso"
                >
                <label for="nombreCursoInput" class="form-label">Nombre del curso</label>
            </div>

            <button type="submit" class="btn btn-primary">
                Actualizar curso
            </button>
            <a href="/cursos/" class="btn btn-info">
                Cancelar
            </a>
        </form>
    </div>

</div>

{% endblock %}
