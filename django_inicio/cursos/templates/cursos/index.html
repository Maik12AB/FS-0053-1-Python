{% extends 'cursos/base.html' %}

{% block breadcrumb %}
    <li class="breadcrumb-item"><a href="/cursos/">Cursos</a></li>
    <li class="breadcrumb-item active" aria-current="page">Lista de cursos</li>
{% endblock %}

{% block context %}
<div class="card">
    <div class="card-header m-0 p-0">
        <div class="containerfluid d-flex justify-content-between align-items-center">
            <h1 class="card-title">Listado de cursos</h1>

            <div class="d-flex align-items-center">
                <a href="/cursos/crear/" class="btn btn-primary me-3">Crear curso</a>
            </div>

        </div>
    </div>

    <div class="card-body">
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for curso in cursos %}
                    <tr>
                        <td>{{ curso.id }}</td>
                        <td>{{ curso.nombre }}</td>
                        <td>
                            <a href="/cursos/{{ curso.uuid }}">
                                Detalle
                            </a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
