<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de curso</title>
</head>
<body>

    {% if detalle %}

        <h1>Detalle de curso {{detalle.nombre }}</h1>

        <p><b>ID:</b> {{detalle.id }}</p>
        <p><b>UUID:</b> {{detalle.uuid }}</p>

    {% else %}

        <p>Curso no encontrado</p>

    {% endif %}

    <a href="/cursos/">Volver</a>

    <hr>
    {{ detalle }}
</body>
</html>
